<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E7058" />
      <stop offset="100%" stop-color="#22372A" />
    </linearGradient>
    <linearGradient id="iconBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#iconBgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="#A2BCA8" stroke-width="4" opacity="0.3" />

  <!-- Document Stack Behind -->
  <rect x="116" y="85" width="280" height="320" rx="36" fill="#FFFFFF" opacity="0.15" transform="rotate(-5 256 256)" />
  <rect x="116" y="85" width="280" height="320" rx="36" fill="#FFFFFF" opacity="0.25" transform="rotate(3 256 256)" />
  
  <!-- Primary Document Card -->
  <rect x="116" y="95" width="280" height="320" rx="36" fill="#1B2C22" stroke="#A2BCA8" stroke-width="3.5" />

  <!-- Document Header & Lines -->
  <rect x="156" y="145" width="95" height="12" rx="6" fill="#A2BCA8" opacity="0.9" />
  <rect x="156" y="175" width="195" height="10" rx="5" fill="#A2BCA8" opacity="0.45" />
  <rect x="156" y="200" width="160" height="10" rx="5" fill="#A2BCA8" opacity="0.45" />
  <rect x="156" y="225" width="120" height="10" rx="5" fill="#A2BCA8" opacity="0.45" />

  <!-- Scanner Citation Beam -->
  <polygon points="256,260 145,360 367,360" fill="url(#iconBeamGrad)" />

  <!-- Optical Proof Lens & Aperture -->
  <circle cx="256" cy="260" r="56" fill="#0F1A14" stroke="#10B981" stroke-width="5" />
  <circle cx="256" cy="260" r="42" fill="#22372A" />
  <circle cx="256" cy="260" r="24" fill="none" stroke="#34D399" stroke-width="3.5" stroke-dasharray="24,8" />
  <circle cx="256" cy="260" r="8" fill="#34D399" />

  <!-- Precision 'Z' Mark inside Lens -->
  <path d="M248 250 L264 250 L248 270 L264 270" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Citation Verified Badge at Bottom -->
  <rect x="176" y="350" width="160" height="36" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5" />
  <circle cx="202" cy="368" r="6" fill="#10B981" />
  <rect x="220" y="363" width="90" height="10" rx="5" fill="#FFFFFF" />
</svg>