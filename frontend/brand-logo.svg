<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5" />
      <stop offset="100%" stop-color="#F4F1EA" />
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E7058" />
      <stop offset="100%" stop-color="#263E30" />
    </linearGradient>

    <!-- Accent Lens Glow Gradient -->
    <linearGradient id="lensGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow for Emblem -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1E3227" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Tech Circuit Accents -->
  <g opacity="0.18">
    <circle cx="220" cy="160" r="4" fill="#2D4838" />
    <circle cx="980" cy="180" r="4" fill="#2D4838" />
    <circle cx="160" cy="460" r="4" fill="#2D4838" />
    <circle cx="1040" cy="440" r="4" fill="#2D4838" />
    <line x1="220" y1="160" x2="300" y2="160" stroke="#2D4838" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="900" y1="180" x2="980" y2="180" stroke="#2D4838" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="160" y1="460" x2="240" y2="460" stroke="#2D4838" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="960" y1="440" x2="1040" y2="440" stroke="#2D4838" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- BRAND EMBLEM GROUP -->
  <g transform="translate(600, 220)" text-anchor="middle" filter="url(#cardShadow)">
    
    <!-- Background Stacked Document Pages -->
    <rect x="-95" y="-105" width="190" height="150" rx="20" fill="#CBD5E1" transform="rotate(-6)" opacity="0.65" />
    <rect x="-95" y="-105" width="190" height="150" rx="20" fill="#E2E8F0" transform="rotate(4)" opacity="0.85" />
    
    <!-- Main Precision Document Shield -->
    <rect x="-95" y="-105" width="190" height="150" rx="22" fill="url(#emeraldGrad)" />

    <!-- Document Decorative Code Lines -->
    <rect x="-65" y="-75" width="65" height="7" rx="3.5" fill="#A2BCA8" opacity="0.85" />
    <rect x="-65" y="-56" width="130" height="6" rx="3" fill="#A2BCA8" opacity="0.45" />
    <rect x="-65" y="-40" width="105" height="6" rx="3" fill="#A2BCA8" opacity="0.45" />
    <rect x="-65" y="-24" width="80" height="6" rx="3" fill="#A2BCA8" opacity="0.45" />

    <!-- Visual Grounding Precision Scanner Beam -->
    <polygon points="0,-15 -85,45 85,45" fill="url(#beamGrad)" />

    <!-- Central Precision Optical Proof Lens -->
    <circle cx="0" cy="-15" r="38" fill="#14221B" stroke="#10B981" stroke-width="3.5" />
    <circle cx="0" cy="-15" r="28" fill="url(#emeraldGrad)" />
    
    <!-- Precision Target Crosshair / Focus Rings -->
    <circle cx="0" cy="-15" r="16" fill="none" stroke="#34D399" stroke-width="2.5" stroke-dasharray="18,6" />
    <circle cx="0" cy="-15" r="5.5" fill="#34D399" />
    
    <!-- Stylized 'Z' Fold Mark in Lens Accent -->
    <path d="M-5 -21 L5 -21 L-5 -9 L5 -9" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Visual Proof Citation Crop Box (Bottom Accent) -->
    <g transform="translate(0, 45)">
      <rect x="-60" y="-8" width="120" height="26" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2" />
      <circle cx="-42" cy="5" r="4" fill="#10B981" />
      <rect x="-30" y="1" width="65" height="8" rx="4" fill="#263E30" opacity="0.85" />
    </g>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(600, 455)" text-anchor="middle">
    <!-- Main Title -->
    <text font-family="'Manrope', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" fill="#1A2520" letter-spacing="-1.5">
      ZenDoc<tspan fill="#10B981"> AI</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text y="48" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="700" font-size="18" fill="#4E7058" letter-spacing="3.5">
      VISUAL DOCUMENT INTELLIGENCE • ANEEVARP SOLUTIONS
    </text>

    <!-- Stat Pill / Feature Highlight -->
    <g transform="translate(0, 85)">
      <rect x="-210" y="-16" width="420" height="32" rx="16" fill="#FFFFFF" stroke="#A2BCA8" stroke-width="1.2" />
      <text y="5" font-family="'IBM Plex Sans', sans-serif" font-weight="600" font-size="13" fill="#263E30" letter-spacing="0.5">
        ⚡ Zero Hallucination Grounded in Pixel-Level Page Proof
      </text>
    </g>
  </g>
</svg>